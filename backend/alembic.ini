# Alembic Configuration File
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration file names
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path (comma separated)
prepend_sys_path = .

# Timezone to use when rendering the date within the migration file
# Leave blank for current timezone
timezone =

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# to be detected as revisions in the versions/ directory
sourceless = false

# Version locations - specifies the absolute or relative paths to the
# version files directory
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator; As mentioned above, this is the character used to split
# version_locations. The default within new alembic.ini files is "os", which uses
# os.pathsep. Note that the Windows compat parameter 'use_windows_slashes' needs to
# be enabled before using "os" on a Windows machine.
version_path_separator = os

# The output encoding used when revision files are written from script.py.mako
# output_encoding = utf-8

# The database URL for migrations
# NOTE: In production, override via environment variable ALEMBIC_DB_URL
# or set DATABASE_URL directly.
# Using async+asyncpg driver – the env.py handles sync fallback for autogenerate.
sqlalchemy.url = postgresql+asyncpg://kyc_user:kyc_password@localhost:5432/kyc_db


# =============================================================================
# Logging Configuration
# =============================================================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
